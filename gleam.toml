name = "glemy_games"
version = "0.1.0"

# Reference games (Tiers, Breakout, Platformer) built on the glemy
# physics/game engine. See glemy's own repository for the engine itself:
# https://github.com/recregt/glemy

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_javascript = ">= 1.0.1 and < 2.0.0"
glemy = ">= 0.1.0 and < 0.2.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"

[javascript]
runtime = "deno"

[javascript.deno]
allow_read = true
